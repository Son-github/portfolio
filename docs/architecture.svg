<rect x="40" y="160" width="250" height="100" rx="12" fill="#ffffff" stroke="#cdd8e5"/>
<rect x="40" y="174" width="4" height="72" rx="2" fill="#72869c"/>
<text x="60" y="190" class="label">Gabia DNS</text>
<text x="60" y="216" class="small">www.son-portfolio.site</text>
<text x="60" y="236" class="small">CNAME → CloudFront</text>
