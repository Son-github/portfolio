<rect x="40" y="550" width="1400" height="220" rx="12" fill="#ffffff" stroke="#cdd8e5"/>
<text x="62" y="579" class="group">DEPLOYMENT / CONTROL PLANE</text>
<rect x="65" y="605" width="300" height="130" rx="12" fill="#ffffff" stroke="#cdd8e5"/>
<rect x="65" y="619" width="4" height="102" rx="2" fill="#334155"/>
<text x="85" y="635" class="label">GitHub Actions</text>
<text x="85" y="661" class="small">main → lint / test / build</text>
<text x="85" y="681" class="small">Checked static artifact</text>
<rect x="430" y="605" width="325" height="130" rx="12" fill="#ffffff" stroke="#cdd8e5"/>
<rect x="430" y="619" width="4" height="102" rx="2" fill="#b46c28"/>
<text x="450" y="635" class="label">AWS STS / IAM role</text>
<text x="450" y="661" class="small">GitHub OIDC · temporary credentials</text>
<text x="450" y="681" class="small">Repository + main trust condition</text>
<rect x="825" y="605" width="295" height="130" rx="12" fill="#ffffff" stroke="#cdd8e5"/>
<rect x="825" y="619" width="4" height="102" rx="2" fill="#3777ce"/>
<text x="845" y="635" class="label">Static publish</text>
<text x="845" y="661" class="small">Upload build artifact to S3</text>
<text x="845" y="681" class="small">CloudFront invalidation + verify</text>
<path d="M 365 670 H 430" class="control"/>
<path d="M 755 670 H 825" class="control"/>
<text x="1150" y="636" class="label">Least privilege</text>
<text x="1150" y="663" class="small">One bucket + one distribution</text>
<text x="1150" y="687" class="small">No infrastructure apply in CI</text>
<path d="M 1120 620 H 1248 V 425" class="control"/>
<rect x="40" y="810" width="1400" height="230" rx="12" fill="#f0f5fb" stroke="#bacbe0" stroke-dasharray="6 5"/>
<text x="62" y="839" class="group">OPERATIONS / OPTIONAL SETUP</text>
<rect x="65" y="860" width="640" height="135" rx="12" fill="#ffffff" stroke="#cdd8e5"/>
<rect x="65" y="874" width="4" height="107" rx="2" fill="#8c4fff"/>
<text x="85" y="890" class="label">CloudFront basic metrics</text>
<text x="85" y="916" class="small">Requests · BytesDownloaded · 4xxErrorRate · 5xxErrorRate</text>
<text x="85" y="936" class="small">Existing free metrics · no alarms / log collection</text>
<text x="85" y="956" class="small">Requests measure HTTP activity, not unique visitors</text>
<rect x="745" y="860" width="670" height="135" rx="12" fill="#ffffff" stroke="#cdd8e5"/>
<rect x="745" y="874" width="4" height="107" rx="2" fill="#3e9648"/>
<text x="765" y="890" class="label">AWS Budgets → owner email</text>
<text x="765" y="916" class="small">Reuse existing account-wide monthly budget</text>
<text x="765" y="936" class="small">ACTUAL cost alerts: &gt; $1 / &gt; $3</text>
<text x="765" y="956" class="small">Human decision → manually Disable / Enable</text>
<text x="62" y="1022" class="small">No automatic shutdown · No Budget Actions · No SNS / Lambda / log collection</text>
<text x="40" y="1076" class="small">Solid: content request flow     Dashed: configuration / deployment     Optional operations require user setup</text>
</svg>