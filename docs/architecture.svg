<svg xml:lang="ko" xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
<title id="title">포트폴리오 | 클라우드 아키텍처</title>
<desc id="description">Terraform으로 관리하는 정적 포트폴리오 구성. 가비아 DNS로 CloudFront에 연결하고, OAC 서명 요청으로 서울 리전의 비공개 S3에서 파일을 가져옵니다. HTTPS 인증서는 버지니아 북부 리전에 있습니다. GitHub Actions는 OIDC 임시 역할로 파일을 배포하고 캐시를 무효화합니다. 비용 알림은 기존 계정 예산을 선택적으로 사용합니다.</desc>
