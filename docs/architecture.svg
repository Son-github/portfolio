<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1100" viewBox="0 0 1480 1100" role="img" aria-labelledby="title description">
<title id="title">Portfolio delivery, deployment and operations architecture</title>
<desc id="description">Gabia DNS resolves the browser to CloudFront, which serves a private S3 origin in Seoul using OAC. ACM in us-east-1 provides HTTPS. GitHub Actions uses OIDC temporary deployment credentials. Existing CloudFront metrics and an account-wide imported cost budget support manual operations.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#546b89"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3777ce"/></marker></defs>
<style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#182d49}.title{font-size:28px;font-weight:700}.label{font-size:18px;font-weight:650}.small{font-size:14px;fill:#526782}.micro{font-size:12px;fill:#647994;letter-spacing:1px}.group{font-size:13px;font-weight:650;fill:#526782;letter-spacing:1.3px}.wire{fill:none;stroke:#546b89;stroke-width:2;marker-end:url(#arrow)}.control{fill:none;stroke:#3777ce;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#blue)}</style>
