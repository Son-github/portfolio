<rect x="40" y="334" width="4" height="77" rx="2" fill="#3777ce"/>
<text x="60" y="350" class="label">Visitor browser</text>
<text x="60" y="376" class="small">HTTPS · GET / HEAD</text>
<text x="60" y="396" class="small">HTML / JS / CSS / images</text>
<rect x="405" y="310" width="290" height="115" rx="12" fill="#ffffff" stroke="#cdd8e5"/>
<rect x="405" y="324" width="4" height="87" rx="2" fill="#8c4fff"/>
<text x="425" y="340" class="label">Amazon CloudFront</text>
<text x="425" y="366" class="small">TLS termination · edge cache</text>
<text x="425" y="386" class="small">HTTPS redirect · compression</text>
<text x="425" y="410" class="micro">GLOBAL</text>
<rect x="1100" y="310" width="295" height="115" rx="12" fill="#ffffff" stroke="#cdd8e5"/>
<rect x="1100" y="324" width="4" height="87" rx="2" fill="#3e9648"/>
<text x="1120" y="340" class="label">Amazon S3</text>
<text x="1120" y="366" class="small">Private static origin</text>
<text x="1120" y="386" class="small">Block Public Access · OAC only</text>
<text x="1120" y="410" class="micro">SEOUL</text>
<rect x="760" y="165" width="285" height="105" rx="12" fill="#ffffff" stroke="#cdd8e5"/>
<rect x="760" y="179" width="4" height="77" rx="2" fill="#ba752b"/>
<text x="780" y="195" class="label">AWS Certificate Manager</text>
<text x="780" y="221" class="small">Public TLS certificate</text>
<text x="780" y="241" class="small">DNS validation at Gabia</text>
<text x="780" y="255" class="micro">US-EAST-1</text>
